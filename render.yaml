services:
  - type: web
    name: ruc-rut
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 run:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: applications
      - key: API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: SESSION_TYPE
        value: filesystem
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
