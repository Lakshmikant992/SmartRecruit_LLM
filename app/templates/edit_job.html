{% extends 'base.html' %}

{% block title %}Edit Job{% endblock %}

{% block content %}
<div class="create-job">
    <div class="title">
        <i class="uil uil-briefcase"></i>
        <span class="text">Edit Job</span>
    </div>
    <!-- Make sure the form action points to the correct route, like 'edit_job' -->
    <form action="{{ url_for('main.edit_job', job_id=job.id) }}" method="post">
        <div class="form-group">
            <label for="job-title">Job Title</label>
            <input type="text" id="job-title" name="title" value="{{ job.title }}" placeholder="Enter job title" required>
        </div>
        <div class="form-group">
            <label for="job-description">Job Description</label>
            <textarea id="job-description" name="description" placeholder="Enter job description" required>{{ job.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="job-role">Role</label>
            <input type="text" id="job-role" name="job_role" value="{{ job.job_role or '' }}" required>
        </div>
        <div class="form-group">
            <label for="job-type">Job Type</label>
            <select id="job-type" name="job_type" required>{% for value in ['Full-time','Part-time','Contract','Internship'] %}<option {% if job.job_type == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select>
        </div>
        <div class="form-group">
            <label for="job-location">Location</label>
            <select id="job-location" name="location" required>
                <option value="Remote" {% if job.location == 'Remote' %}selected{% endif %}>Remote</option>
                <option value="New York, NY" {% if job.location == 'New York, NY' %}selected{% endif %}>New York, NY</option>
                <option value="London, UK" {% if job.location == 'London, UK' %}selected{% endif %}>London, UK</option>
                <option value="Toronto, Canada" {% if job.location == 'Toronto, Canada' %}selected{% endif %}>Toronto, Canada</option>
            </select>
        </div>
        <div class="form-group">
            <label for="job-experience">Experience Level</label>
            <select id="job-experience" name="experience" required>
                <option value="Entry level" {% if job.experience == 'Entry level' %}selected{% endif %}>Entry level</option>
                <option value="Mid level" {% if job.experience == 'Mid level' %}selected{% endif %}>Mid level</option>
                <option value="Senior" {% if job.experience == 'Senior' %}selected{% endif %}>Senior</option>
                <option value="Lead / Principal" {% if job.experience == 'Lead / Principal' %}selected{% endif %}>Lead / Principal</option>
            </select>
        </div>
        <div class="form-group">
            <label for="job-salary">Salary</label>
            <input type="number" id="job-salary" name="salary" value="{{ job.salary }}" placeholder="Enter job salary" required>
        </div>
        <button type="submit">Update Job</button>
    </form>
</div>
{% endblock %}
